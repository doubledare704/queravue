# Local test databases for Queravue development and integration tests.
# Dev-only credentials; ports bind to 127.0.0.1. Override values via dev/.env
# (see .env.example). Seeds live in dev/seed/<engine>/; mysql and mariadb load
# theirs on first start (drop the volume to reload).
#
#   docker compose -f dev/docker-compose.yml up -d --wait
#
# Services with a profile (documentdb) do not start with a plain `up`; name
# them to start them. To free memory while working on one engine, run
# `make db-only DB=<service>`: it stops every other service first.
name: queravue-dev

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${PG_USER:-queravue}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-queravue}
      POSTGRES_DB: ${PG_DB:-queravue}
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-queravue}
      MYSQL_USER: ${MYSQL_USER:-queravue}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-queravue}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-queravue}
    ports: ["127.0.0.1:${MYSQL_PORT:-3306}:3306"]
    volumes:
      - mysql:/var/lib/mysql
      - ./seed/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mariadb:
    image: mariadb:11.4.5
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-queravue}
      MARIADB_USER: ${MARIADB_USER:-queravue}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-queravue}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-queravue}
    ports: ["127.0.0.1:${MARIADB_PORT:-3307}:3306"]
    volumes:
      - mariadb:/var/lib/mysql
      - ./seed/mariadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # healthcheck.sh ships with the official image; --innodb_initialized
      # waits for the init scripts (seed) to finish.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  tidb:
    # Single-process playground (unistore, no PD/TiKV): enough for protocol and
    # SQL-compat tests. Not for performance numbers.
    image: pingcap/tidb:v8.5.1
    command: ["--store=unistore", "--path=", "--host=0.0.0.0", "-P", "4000"]
    ports: ["127.0.0.1:${TIDB_PORT:-4000}:4000"]
    healthcheck:
      # No curl in the image: ask the status port with bash /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/10080 && printf 'GET /status HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s

  cockroachdb:
    image: cockroachdb/cockroach:v25.4.2
    # In-memory store: a disk-backed 1M-row seed takes ~12 min on a laptop
    # VM. Data is gone on restart; reload dev/seed/cockroachdb.
    command: ["start-single-node", "--insecure", "--store=type=mem,size=2GiB"]
    ports:
      - "127.0.0.1:${COCKROACH_PORT:-26257}:26257"
      - "127.0.0.1:${COCKROACH_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "./cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  mongo:
    image: ${MONGO_IMAGE:-mongo:8.0.34}
    # Single-node replica set so transactions and change streams work.
    # No auth: a keyed replica set needs keyfile setup we don't need locally.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    volumes: [mongo:/data/db]
    healthcheck:
      # Initiates the replica set on first run; healthy once this node is primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})
          }
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  mongo-seed:
    # One-shot: loads dev/seed/mongo (users, orders, 1M-document events).
    #   docker compose -f dev/docker-compose.yml --profile seed up mongo-seed
    profiles: ["seed"]
    image: ${MONGO_IMAGE:-mongo:8.0.34}
    depends_on:
      mongo: {condition: service_healthy}
    volumes: ["./seed/mongo:/seed:ro"]
    entrypoint: ["mongosh", "--quiet", "mongodb://mongo:27017/?directConnection=true", "/seed/01_seed.js"]
    restart: "no"

  documentdb:
    # Open-source DocumentDB (documentdb.io): PostgreSQL plus a MongoDB wire
    # gateway. Stands in for Amazon DocumentDB and Cosmos DB for MongoDB vCore.
    # Self-signed TLS on 10260. Not started by a plain `up`: name it, or use
    # `make db-only DB=documentdb`. The image defines its own HEALTHCHECK.
    profiles: ["documentdb"]
    image: ghcr.io/documentdb/documentdb/documentdb-local:pg17-1.0.0
    environment:
      USERNAME: ${DOCDB_USER:-queravue}
      PASSWORD: ${DOCDB_PASSWORD:-Queravue_dev1}
      DOCUMENTDB_USAGE_TELEMETRY: "false"
    ports: ["127.0.0.1:${DOCDB_PORT:-10260}:10260"]
    volumes: [documentdb:/data]

  redis:
    image: redis:7.4.12
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-queravue}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-queravue}
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    # No arm64 image: runs under emulation on Apple Silicon (enable Rosetta in
    # OrbStack / Docker Desktop for usable speed).
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Queravue_dev1}
    ports: ["127.0.0.1:${MSSQL_PORT:-1433}:1433"]
    volumes: [mssql:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  mssql-seed:
    # One-shot: loads dev/seed/mssql into the running mssql service.
    #   docker compose -f dev/docker-compose.yml --profile seed up mssql-seed
    profiles: ["seed"]
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    platform: linux/amd64
    depends_on:
      mssql: {condition: service_healthy}
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Queravue_dev1}
    volumes: ["./seed/mssql:/seed:ro"]
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -i /seed/01_schema.sql"]
    restart: "no"

  clickhouse:
    # 26.3 is the current LTS line.
    image: clickhouse/clickhouse-server:26.3.25.2
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-queravue}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-queravue}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-queravue}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes: [clickhouse:/var/lib/clickhouse]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres:
  mysql:
  mariadb:
  mongo:
  documentdb:
  redis:
  mssql:
  clickhouse:
