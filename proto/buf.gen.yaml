# Generates Go (core) and Dart (app) code from proto/.
# Remote plugins: no local protoc plugins needed. Bump versions together with
# google.golang.org/protobuf, google.golang.org/grpc (core/go.mod) and the
# Dart `protobuf` / `grpc` packages (app/pubspec.yaml).
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/doubledare704/queravue/core/internal/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../core/internal/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.0
    out: ../core/internal/gen
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/dart:v25.0.0
    out: ../app/lib/core_client/gen
    opt: grpc
