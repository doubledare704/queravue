syntax = "proto3";

// Package queravue.v1 is the contract between the Queravue Flutter UI and the
// Go core sidecar. Every request must carry the per-launch auth token in the
// `authorization: Bearer <token>` metadata entry.
package queravue.v1;

import "google/protobuf/timestamp.proto";

// CoreService covers the core sidecar's own lifecycle: handshake and liveness.
service CoreService {
  // Hello is the handshake the UI sends after connecting. It returns the core
  // version and the features this core supports.
  rpc Hello(HelloRequest) returns (HelloResponse);

  // Health streams heartbeats until the client cancels. The UI treats a broken
  // stream or missing heartbeats as a dead core and restarts it.
  rpc Health(HealthRequest) returns (stream HealthResponse);
}

// HelloRequest identifies the connecting UI.
message HelloRequest {
  // Version of the UI build, e.g. "0.1.0". Informational; may be empty.
  string client_version = 1;
}

// HelloResponse describes the running core.
message HelloResponse {
  // Semantic version of the core build, e.g. "0.1.0".
  string core_version = 1;
  // Contract revision implemented by the core. Starts at 1 and increases
  // when RPCs are added, so the UI can feature-gate against older cores.
  uint32 protocol_version = 2;
  // Core-level capability names, e.g. "health". Unknown names must be
  // ignored by the UI. Engine capabilities are reported per connection.
  repeated string capabilities = 3;
}

// HealthRequest configures the heartbeat stream.
message HealthRequest {
  // Desired interval between heartbeats in milliseconds. 0 means the core
  // default (1000). The core clamps values to [250, 10000].
  uint32 interval_ms = 1;
}

// HealthStatus is the core's self-reported state.
enum HealthStatus {
  // Not set. Treat as unhealthy.
  HEALTH_STATUS_UNSPECIFIED = 0;
  // Accepting and serving requests.
  HEALTH_STATUS_SERVING = 1;
  // Shutting down; the stream will end shortly.
  HEALTH_STATUS_DRAINING = 2;
}

// HealthResponse is one heartbeat.
message HealthResponse {
  // Heartbeat counter for this stream, starting at 1.
  uint64 seq = 1;
  // Core wall-clock time when the heartbeat was sent.
  google.protobuf.Timestamp time = 2;
  // Current core state.
  HealthStatus status = 3;
}
