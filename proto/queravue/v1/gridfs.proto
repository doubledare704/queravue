syntax = "proto3";

package queravue.v1;

// GridFsService browses, previews, uploads and downloads files stored in
// MongoDB GridFS buckets, for sessions whose engine has the "gridfs"
// capability (ADR 0023).
//
// File bytes always stream in chunks of at most 1 MiB; neither side holds a
// whole file. File ids travel as canonical EJSON. Failures the user can act
// on are returned in-band as GridFsError. Unknown sessions are NOT_FOUND and
// sessions without the capability are FAILED_PRECONDITION.
service GridFsService {
  // ListBuckets returns the buckets of a database: every <name>.files
  // collection that has a matching <name>.chunks collection.
  rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse);

  // ListFiles streams one page of a bucket's files in batches. The last batch
  // has done=true. Cancelling the call closes the cursor.
  rpc ListFiles(ListFilesRequest) returns (stream ListFilesResponse);

  // Download streams the file header and then its bytes, optionally a range.
  // Cancelling the call stops reading chunks.
  rpc Download(DownloadRequest) returns (stream DownloadResponse);

  // Upload stores a new file, or replaces one. The first message carries the
  // header, every later one a chunk of bytes. A cancelled or failed upload
  // removes the chunks it wrote.
  rpc Upload(stream UploadRequest) returns (UploadResponse);

  // DeleteFile removes a file and its chunks. Needs confirmed=true on
  // production connections.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);

  // RenameFile changes a file's filename.
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);
}

// GridFsErrorKind classifies a GridFS operation failure.
enum GridFsErrorKind {
  // Unclassified failure.
  GRID_FS_ERROR_KIND_UNSPECIFIED = 0;
  // The filter, sort, id or metadata is not valid EJSON.
  GRID_FS_ERROR_KIND_PARSE = 1;
  // The bucket or file does not exist.
  GRID_FS_ERROR_KIND_NOT_FOUND = 2;
  // The connection is flagged production and the request did not set
  // confirmed. Nothing was changed.
  GRID_FS_ERROR_KIND_CONFIRMATION_REQUIRED = 3;
  // Bad credentials or not permitted.
  GRID_FS_ERROR_KIND_AUTH = 4;
  // Server unreachable or connection lost.
  GRID_FS_ERROR_KIND_NETWORK = 5;
  // The operation exceeded max_time_ms or the server selection timeout.
  GRID_FS_ERROR_KIND_TIMEOUT = 6;
  // The operation was cancelled.
  GRID_FS_ERROR_KIND_CANCELED = 7;
  // The server does not support the operation.
  GRID_FS_ERROR_KIND_UNSUPPORTED = 8;
  // The server rejected the operation.
  GRID_FS_ERROR_KIND_SERVER = 9;
  // The file's chunks are missing or shorter than its length.
  GRID_FS_ERROR_KIND_CORRUPT = 10;
}

// GridFsError is a typed failure. The message never contains secrets.
message GridFsError {
  // Failure class.
  GridFsErrorKind kind = 1;
  // Human-readable detail.
  string message = 2;
}

// GridFsBucket is one bucket of a database.
message GridFsBucket {
  // Bucket name: the collection prefix before ".files" and ".chunks".
  string name = 1;
  // Estimated number of files.
  uint64 file_count_estimate = 2;
  // Sum of the files' lengths in bytes, when the server reports it cheaply.
  optional uint64 total_bytes = 3;
}

// GridFsFile is one entry of a bucket's files collection.
message GridFsFile {
  // The file's _id as canonical EJSON.
  string id_ejson = 1;
  // Filename. Not unique: GridFS allows several files with one name.
  string filename = 2;
  // Length in bytes.
  uint64 length = 3;
  // Chunk size in bytes.
  uint32 chunk_size = 4;
  // Upload time in milliseconds since the Unix epoch.
  int64 upload_date_ms = 5;
  // metadata.contentType, else the deprecated top-level contentType. Empty
  // when neither is set.
  string content_type = 6;
  // The metadata document as canonical EJSON, or empty when there is none.
  string metadata_ejson = 7;
}

// ListBucketsRequest is the input of ListBuckets.
message ListBucketsRequest {
  // Session id.
  string session_id = 1;
  // Database name.
  string database = 2;
}

// ListBucketsResponse holds the buckets or the failure.
message ListBucketsResponse {
  // Buckets sorted by name.
  repeated GridFsBucket buckets = 1;
  // Set when listing failed.
  GridFsError error = 2;
}

// ListFilesRequest is the input of ListFiles.
message ListFilesRequest {
  // Session id.
  string session_id = 1;
  // Database name.
  string database = 2;
  // Bucket name.
  string bucket = 3;
  // Filter on the files collection as EJSON text. Empty means {}.
  string filter = 4;
  // Sort as EJSON text. Empty means natural order.
  string sort = 5;
  // Files to skip.
  uint64 skip = 6;
  // Maximum files to return. 0 means no limit.
  uint64 limit = 7;
  // Server-side time limit (maxTimeMS). 0 means the core default (30000).
  uint32 max_time_ms = 8;
}

// GridFsFileBatch is a group of files.
message GridFsFileBatch {
  // Index of files[0] among the files of this call, starting at 0.
  uint64 offset = 1;
  // Files in this batch.
  repeated GridFsFile files = 2;
  // True on the last batch.
  bool done = 3;
}

// ListFilesResponse is one event of a ListFiles stream.
message ListFilesResponse {
  // The event.
  oneof event {
    // A batch of files.
    GridFsFileBatch batch = 1;
    // The call failed. This is the last event.
    GridFsError error = 2;
  }
}

// DownloadRequest is the input of Download.
message DownloadRequest {
  // Session id.
  string session_id = 1;
  // Database name.
  string database = 2;
  // Bucket name.
  string bucket = 3;
  // The file's _id as canonical EJSON.
  string id_ejson = 4;
  // First byte to send.
  uint64 offset = 5;
  // Bytes to send from offset. Unset means up to the end of the file.
  optional uint64 length = 6;
}

// DownloadResponse is one event of a Download stream.
message DownloadResponse {
  // The event.
  oneof event {
    // The file. Always the first event of a successful download.
    GridFsFile file = 1;
    // The next bytes, at most 1 MiB.
    bytes chunk = 2;
    // The download failed. This is the last event.
    GridFsError error = 3;
  }
}

// UploadHeader describes the file an Upload stores.
message UploadHeader {
  // Session id.
  string session_id = 1;
  // Database name.
  string database = 2;
  // Bucket name. Created on first upload if it does not exist.
  string bucket = 3;
  // Filename.
  string filename = 4;
  // Stored as metadata.contentType. Empty means none.
  string content_type = 5;
  // Metadata document as EJSON text. Empty means none.
  string metadata_ejson = 6;
  // Chunk size in bytes. 0 means the GridFS default (255 KiB).
  uint32 chunk_size_bytes = 7;
  // When set, the file with this canonical EJSON _id is replaced after the
  // new file is stored.
  string replace_id_ejson = 8;
  // Must be true to replace a file on production connections, else
  // CONFIRMATION_REQUIRED.
  bool confirmed = 9;
}

// UploadRequest is one message of an Upload stream.
message UploadRequest {
  // The message.
  oneof part {
    // The first message.
    UploadHeader header = 1;
    // File bytes. Every message after the header.
    bytes chunk = 2;
  }
}

// UploadResponse holds the stored file or the failure.
message UploadResponse {
  // The stored file.
  GridFsFile file = 1;
  // Set when the upload failed or needs confirmation.
  GridFsError error = 2;
}

// DeleteFileRequest is the input of DeleteFile.
message DeleteFileRequest {
  // Session id.
  string session_id = 1;
  // Database name.
  string database = 2;
  // Bucket name.
  string bucket = 3;
  // The file's _id as canonical EJSON.
  string id_ejson = 4;
  // Must be true on production connections, else CONFIRMATION_REQUIRED.
  bool confirmed = 5;
}

// DeleteFileResponse holds the failure, if any.
message DeleteFileResponse {
  // Set when the delete failed or needs confirmation.
  GridFsError error = 1;
}

// RenameFileRequest is the input of RenameFile.
message RenameFileRequest {
  // Session id.
  string session_id = 1;
  // Database name.
  string database = 2;
  // Bucket name.
  string bucket = 3;
  // The file's _id as canonical EJSON.
  string id_ejson = 4;
  // New filename.
  string new_filename = 5;
}

// RenameFileResponse holds the failure, if any.
message RenameFileResponse {
  // Set when the rename failed.
  GridFsError error = 1;
}
