version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - wrapcheck
  settings:
    wrapcheck:
      ignore-package-globs:
        - google.golang.org/grpc/*
        - github.com/doubledare704/queravue/*
        - github.com/redis/go-redis/*
  exclusions:
    generated: strict
    paths:
      - internal/gen
    rules:
      - path: _test\.go
        linters: [gosec, wrapcheck]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/doubledare704/queravue
