name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Proto (buf)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          input: proto
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=${{ github.base_ref }},subdir=proto
          push: false
      - name: Generated code is up to date
        run: |
          cd proto && buf generate
          git diff --exit-code -- ../core/internal/gen ../app/lib/core_client/gen

  core:
    name: Core (Go)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: go build ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: core

  app:
    name: App (Flutter)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: dart format
        run: dart format --output=none --set-exit-if-changed $(find lib test integration_test -name '*.dart' -not -path '*/gen/*')
      - run: flutter test
