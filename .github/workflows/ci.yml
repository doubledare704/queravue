name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Proto (buf)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          input: proto
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=${{ github.base_ref }},subdir=proto
          push: false
          # The workflow token is read-only; posting a PR summary comment
          # would need pull-requests: write.
          pr_comment: false
      - name: Generated code is up to date
        run: |
          cd proto && buf generate
          git diff --exit-code -- ../core/internal/gen ../app/lib/core_client/gen

  core:
    name: Core (Go)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: go build ./...
      - run: go test -race ./...
      - name: The default build does not link DuckDB
        run: "! go list -deps ./cmd/queravued | grep -q duckdb"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: core

  core-duckdb:
    name: Core + DuckDB (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, race: -race, packages: ./...}
          - {os: ubuntu-latest, race: -race, packages: ./...}
          - {os: windows-latest, race: "", packages: ./internal/engine/duckdb/... ./internal/engine/engines/... ./internal/sqldialect/... ./internal/sqlsplit/...}
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: go build -tags duckdb ./...
      - run: go test ${{ matrix.race }} -tags duckdb ${{ matrix.packages }}
      - if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: core
          args: --build-tags=duckdb

  integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: MySQL, service: mysql, pkg: mysql, test: TestIntegrationMySQL}
          - {name: MariaDB, service: mariadb, pkg: mysql, test: TestIntegrationMariaDB}
          - {name: TiDB, service: tidb, pkg: mysql, test: TestIntegrationTiDB}
          - {name: PostgreSQL, service: postgres, pkg: postgres, test: TestIntegrationSuitePostgres}
          - {name: SQL Server, service: mssql, pkg: mssql, test: 'TestIntegration.*'}
          - {name: CockroachDB, service: cockroachdb, pkg: postgres, test: TestIntegrationSuiteCockroach}
          - {name: MongoDB, service: mongo, pkg: mongo, test: 'TestIntegration.*'}
          - {name: DocumentDB, service: documentdb, pkg: mongo, test: TestSmokeDocumentDB}
    env:
      # MongoDB 8.x aborts at startup on the runners' Linux kernel 6.19+
      # (SERVER-121912); 7.0 starts. Local dev stays on the compose default.
      MONGO_IMAGE: mongo:7.0.45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Start database
        run: |
          docker compose -f dev/docker-compose.yml up -d --wait ${{ matrix.service }} || {
            docker compose -f dev/docker-compose.yml logs --tail 100 ${{ matrix.service }}
            exit 1
          }
      - name: Seed TiDB (no init directory)
        if: matrix.service == 'tidb'
        run: |
          mysql -h127.0.0.1 -P4000 -uroot < dev/seed/tidb/01_schema.sql
          # TiDB publishes table_rows from its statistics asynchronously
          # after ANALYZE; wait so the suite's estimate check does not race it.
          for i in $(seq 1 60); do
            n=$(mysql -h127.0.0.1 -P4000 -uroot -N -e "SELECT table_rows FROM information_schema.tables WHERE table_schema = 'queravue' AND table_name = 'million_items'")
            [ "${n:-0}" -ge 100000 ] 2>/dev/null && exit 0
            sleep 2
          done
          echo "TiDB row estimate did not reach 100000 within 2 minutes" >&2
          exit 1
      - name: Seed PostgreSQL (not loaded by the image)
        if: matrix.service == 'postgres'
        run: docker exec -i queravue-dev-postgres-1 psql -q -U queravue -d queravue < dev/seed/postgres/01_schema.sql
      - name: Seed SQL Server (no init directory)
        if: matrix.service == 'mssql'
        run: docker compose -f dev/docker-compose.yml --profile seed up mssql-seed
      - name: Seed MongoDB (users, orders, 1M events)
        if: matrix.service == 'mongo'
        run: docker compose -f dev/docker-compose.yml --profile seed up mongo-seed
      - name: Seed CockroachDB (no init directory)
        if: matrix.service == 'cockroachdb'
        run: |
          docker exec -i queravue-dev-cockroachdb-1 ./cockroach sql --insecure < dev/seed/cockroachdb/01_schema.sql
          # Table statistics reach the row-estimate view asynchronously; wait
          # for them so the suite's estimate check does not race the seed.
          for i in $(seq 1 60); do
            n=$(docker exec queravue-dev-cockroachdb-1 ./cockroach sql --insecure -d queravue --format=csv \
              -e "SELECT estimated_row_count FROM crdb_internal.table_row_statistics WHERE table_id = 'million_items'::regclass::int" | tail -1)
            [ "${n:-0}" -gt 0 ] 2>/dev/null && exit 0
            sleep 2
          done
          echo "row statistics did not appear within 2 minutes" >&2
          exit 1
      - name: Integration tests
        working-directory: core
        env:
          # Read only by TestSmokeDocumentDB; dev-only credentials from compose.
          QV_DOCDB_URI: mongodb://queravue:Queravue_dev1@127.0.0.1:10260/?tls=true&tlsAllowInvalidCertificates=true&directConnection=true
        run: go test -tags=integration -run '^${{ matrix.test }}$' ./internal/engine/${{ matrix.pkg }}/...
      - name: Core budgets on 500 tables (completion 10 ms p95, schema graph 200 ms p95)
        if: matrix.service == 'postgres'
        working-directory: core
        run: |
          docker compose -f ../dev/docker-compose.yml --profile large-schema up postgres-large-seed
          go test -count=1 -tags=integration -v -run TestIntegrationLargeSchema ./internal/completion/ ./internal/diagram/ | tee "$RUNNER_TEMP/large.log"
          # The test skips when the seed is missing; a skip here would hide the budget.
          ! grep -q -- '--- SKIP' "$RUNNER_TEMP/large.log"
      - name: Mongo shell corpus
        if: matrix.service == 'mongo'
        working-directory: core
        run: go test -count=1 -tags=integration ./internal/shell/...
      - name: Mongo shell smoke (DocumentDB)
        if: matrix.service == 'documentdb'
        working-directory: core
        env:
          QV_DOCDB_URI: mongodb://queravue:Queravue_dev1@127.0.0.1:10260/?tls=true&tlsAllowInvalidCertificates=true&directConnection=true
        run: go test -count=1 -tags=integration -run TestSmokeShellDocumentDB ./internal/shell/...

  app:
    name: App (Flutter)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: dart format
        run: dart format --output=none --set-exit-if-changed $(find lib test integration_test -name '*.dart' -not -path '*/gen/*')
      - run: flutter test

  shell-e2e:
    name: Shell + workspace (real app and core)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Docker is not available on macOS runners: run mongod natively.
      QUERAVUE_SECRETS: memory
      QUERAVUE_E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Start MongoDB (single-node replica set)
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community@7.0 mongosh
          mkdir -p "$RUNNER_TEMP/mongo-data"
          "$(brew --prefix mongodb-community@7.0)/bin/mongod" --replSet rs0 --bind_ip 127.0.0.1 \
            --dbpath "$RUNNER_TEMP/mongo-data" --logpath "$RUNNER_TEMP/mongod.log" --fork
          mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in $(seq 1 60); do
            mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && exit 0
            sleep 1
          done
          echo "MongoDB did not become primary" >&2
          tail -50 "$RUNNER_TEMP/mongod.log" >&2
          exit 1
      - name: Build the core
        run: cd core && CGO_ENABLED=0 go build -o bin/queravued ./cmd/queravued
      - run: cd app && flutter pub get
      - name: Save a Mongo script, restart the app, reopen it and run it
        working-directory: app
        run: |
          export QUERAVUE_WORKSPACE="$RUNNER_TEMP/workspace"
          export QUERAVUE_CONFIG_DIR="$RUNNER_TEMP/config"
          flutter test integration_test/shell_workspace_test.dart -d macos
      - name: Design a table, review its DDL, apply it and edit it
        working-directory: app
        run: |
          export QUERAVUE_CONFIG_DIR="$RUNNER_TEMP/designer-config"
          flutter test integration_test/designer_test.dart -d macos
      - name: Indexes, Stats and Validation sections against the real core
        working-directory: app
        run: |
          export QUERAVUE_CONFIG_DIR="$RUNNER_TEMP/panels-config"
          flutter test integration_test/panels_test.dart -d macos
      - name: Draft tables and a relation on the diagram and apply them (SQLite)
        working-directory: app
        run: |
          export QUERAVUE_CONFIG_DIR="$RUNNER_TEMP/diagram-config"
          export QV_E2E_SKIP_POSTGRES=1
          flutter test integration_test/diagram_design_test.dart -d macos

  completion-perf:
    name: Completion budget (keystroke to popup)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      QUERAVUE_SECRETS: memory
      QUERAVUE_E2E: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      # Docker is not available on macOS runners: run PostgreSQL natively.
      - name: Start PostgreSQL with the 500-table schema
        run: |
          brew install postgresql@17
          PG="$(brew --prefix postgresql@17)/bin"
          "$PG/initdb" -D "$RUNNER_TEMP/pg" -U queravue --auth=trust > /dev/null
          "$PG/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-c listen_addresses=127.0.0.1" -w start
          "$PG/createdb" -h 127.0.0.1 -U queravue queravue
          for seed in dev/seed/postgres/01_schema.sql dev/seed/postgres/large/01_500_tables.sql; do
            "$PG/psql" -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -U queravue -d queravue -f "$seed"
          done
      - name: Build the core
        run: cd core && CGO_ENABLED=0 go build -o bin/queravued ./cmd/queravued
      - run: cd app && flutter pub get
      - name: Keystroke to popup on the real app and core (profile build)
        working-directory: app
        run: |
          export QUERAVUE_CONFIG_DIR="$RUNNER_TEMP/perf-config"
          export QUERAVUE_WORKSPACE="$RUNNER_TEMP/perf-workspace"
          # The 50 ms budget is for Apple Silicon hardware; the first run on a
          # shared runner measured 85 ms p95, so CI only catches gross regressions.
          export COMPLETION_BUDGET_MS=150
          flutter drive --profile -d macos --driver=test_driver/perf_driver.dart \
            --target=integration_test/completion_perf_test.dart
