name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Proto (buf)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.75.0
          input: proto
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=${{ github.base_ref }},subdir=proto
          push: false
          # The workflow token is read-only; posting a PR summary comment
          # would need pull-requests: write.
          pr_comment: false
      - name: Generated code is up to date
        run: |
          cd proto && buf generate
          git diff --exit-code -- ../core/internal/gen ../app/lib/core_client/gen

  core:
    name: Core (Go)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: go build ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: core

  integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: MySQL, service: mysql, pkg: mysql, test: TestIntegrationMySQL}
          - {name: MariaDB, service: mariadb, pkg: mysql, test: TestIntegrationMariaDB}
          - {name: TiDB, service: tidb, pkg: mysql, test: TestIntegrationTiDB}
          - {name: PostgreSQL, service: postgres, pkg: postgres, test: TestIntegrationSuitePostgres}
          - {name: CockroachDB, service: cockroachdb, pkg: postgres, test: TestIntegrationSuiteCockroach}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Start database
        run: docker compose -f dev/docker-compose.yml up -d --wait ${{ matrix.service }}
      - name: Seed TiDB (no init directory)
        if: matrix.service == 'tidb'
        run: mysql -h127.0.0.1 -P4000 -uroot < dev/seed/tidb/01_schema.sql
      - name: Seed PostgreSQL (not loaded by the image)
        if: matrix.service == 'postgres'
        run: docker exec -i queravue-dev-postgres-1 psql -q -U queravue -d queravue < dev/seed/postgres/01_schema.sql
      - name: Seed CockroachDB (no init directory)
        if: matrix.service == 'cockroachdb'
        run: docker exec -i queravue-dev-cockroachdb-1 ./cockroach sql --insecure < dev/seed/cockroachdb/01_schema.sql
      - name: Integration tests
        working-directory: core
        run: go test -tags=integration -run '^${{ matrix.test }}$' ./internal/engine/${{ matrix.pkg }}/...

  app:
    name: App (Flutter)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: dart format
        run: dart format --output=none --set-exit-if-changed $(find lib test integration_test -name '*.dart' -not -path '*/gen/*')
      - run: flutter test
